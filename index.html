<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Showroom</title>
    <link rel="shortcut icon" href="./src/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-obsidian">

    <!-- Header -->
    <nav class="fixed w-full border-b border-carbon top-0 z-50 bg-obsidian/70 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">


                <div class="shrink-0 flex items-center">
                    <img src="./src/images/logo.png" alt="Logo" class="w-12 h-12">
                </div>


                <div class="hidden md:flex space-x-8">
                    <a href="#"
                        class="text-silver hover:text-infrared text-sm font-semibold tracking-wide transition duration-300">HOME</a>
                    <a href="#"
                        class="text-silver hover:text-infrared text-sm font-semibold tracking-wide transition duration-300">VEHICLES</a>
                    <a href="#"
                        class="text-silver hover:text-infrared text-sm font-semibold tracking-wide transition duration-300">ABOUT
                        US</a>
                </div>


                <div class="flex items-center space-x-4">

                    <a href="#"
                        class="hidden md:block bg-infrared text-white px-6 py-2 rounded-md font-bold hover:bg-red-700 transition duration-300">
                        CONTACT US
                    </a>

                    <button class="md:hidden text-silver hover:text-white focus:outline-none">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </nav>
    <!-- Header -->

    <!-- Hero Section -->
    <section class="relative h-screen flex items-center justify-start overflow-hidden">


        
        <div class="absolute inset-0 z-0 bg-obsidian">
            
            <div id="hero-carousel" class="absolute inset-0 w-full h-full">
                <img src="./src/images/hero_1.jpg"
                    class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-100"
                    alt="Slide 1" />
                <img src="./src/images/hero_2.jpg"
                    class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0"
                    alt="Slide 2" />
                <img src="./src/images/hero_3.jpg"
                    class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0"
                    alt="Slide 3" />
                <img src="./src/images/hero_4.jpg"
                    class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0"
                    alt="Slide 4" />
                <img src="./src/images/hero_5.jpg"
                    class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0"
                    alt="Slide 5" />
            </div>

            <div class="absolute inset-0 bg-linear-to-r from-obsidian via-obsidian/70 to-transparent z-10"></div>
            <div class="absolute inset-0 bg-linear-to-t from-obsidian via-transparent to-transparent z-10"></div>
        </div>

        <div class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20">
            <div class="max-w-2xl">
                <p class="text-infrared font-bold tracking-[0.3em] uppercase mb-4 text-sm">
                    Private Collection
                </p>

                <h1 class="text-5xl md:text-7xl font-bold text-white leading-tight mb-6">
                    Engineering, <br>
                    <span class="text-silver">distilled to silence.</span>
                </h1>

                <p class="text-slate text-lg mb-10 max-w-xl">
                    A curated gallery of the world's most significant motorcars. Explore our exclusive collection of
                    brand-new and pre-owned vehicles tailored for perfection.
                </p>

                <div class="flex flex-wrap gap-4">
                    <button
                        class="bg-infrared text-white px-8 py-3 rounded-md font-bold hover:bg-red-700 transition duration-300 shadow-lg shadow-infrared/30">
                        Explore Collection
                    </button>
                    <button
                        class="bg-transparent border border-silver text-silver px-8 py-3 rounded-md font-bold hover:bg-silver hover:text-obsidian transition duration-300">
                        Book Test Drive
                    </button>
                </div>
            </div>
        </div>

    </section>
    <!-- Hero Section -->

    <script src="./script.js"></script>

</body>

</html>
